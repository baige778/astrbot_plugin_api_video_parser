<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>视频解析 · 黑白名单设置</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e3e5e8;
    --text: #1a1d21;
    --text-sub: #6b7280;
    --accent: #3b82f6;
    --accent-weak: #eff6ff;
    --danger: #ef4444;
    --ok: #10b981;
    --warn: #f59e0b;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --card: #1e2126;
    --border: #2e3238;
    --text: #e6e8eb;
    --text-sub: #9aa2ad;
    --accent: #60a5fa;
    --accent-weak: #1e293b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px;
    transition: background 0.2s, color 0.2s;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--text-sub); margin: 0 0 24px; font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex: none;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .label { font-weight: 600; }
  .hint { color: var(--text-sub); font-size: 12px; margin-top: 2px; }
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #cbd2d9; border-radius: 24px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--text-sub);
    padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.15s;
  }
  .seg button.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .status-badge.ok { background: rgba(16,185,129,0.14); color: var(--ok); }
  .status-badge.bad { background: rgba(245,158,11,0.15); color: var(--warn); }
  .status-badge.loading { background: rgba(107,114,128,0.14); color: var(--text-sub); }
  .group-list { border: 1px solid var(--border); border-radius: 8px; max-height: 320px; overflow: auto; }
  .group-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
  }
  .group-item:last-child { border-bottom: 0; }
  .group-item:hover { background: var(--accent-weak); }
  .group-item input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; flex: none; }
  .group-item .gname { font-weight: 500; }
  .group-item .gid { color: var(--text-sub); font-size: 12px; margin-left: auto; font-family: ui-monospace, monospace; }
  .empty { padding: 28px; text-align: center; color: var(--text-sub); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .banner { display: none; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .banner.show { display: block; }
  .banner.info { background: var(--accent-weak); color: var(--accent); border: 1px solid var(--accent); }
  .banner.err { background: rgba(239,68,68,0.12); color: var(--danger); border: 1px solid var(--danger); }
  .spinner {
    width: 12px; height: 12px; border: 2px solid var(--text-sub);
    border-top-color: transparent; border-radius: 50%; display: inline-block;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>视频解析 · 群聊黑白名单</h1>
  <p class="subtitle">控制机器人对视频/图集分享链接的解析权限，并查看抖音登录状态。</p>

  <div class="card">
    <h2><span class="dot"></span>抖音登录状态</h2>
    <div class="row">
      <div>
        <div class="label" id="login-status-text">查询中…</div>
        <div class="hint" id="login-status-hint">正在向解析后端查询登录态</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="status-badge loading" id="login-badge"><span class="spinner"></span>查询中</span>
        <button class="btn small" id="btn-status-refresh">刷新</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>群聊黑白名单</h2>
    <div class="banner info" id="banner"></div>
    <div class="banner err" id="banner-err"></div>

    <div class="field">
      <div class="row">
        <div>
          <div class="label">启用群聊黑白名单</div>
          <div class="hint">开启后，只有符合规则的会话才能调用视频解析。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="filter-enabled" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="field">
      <div class="row">
        <div>
          <div class="label">过滤模式</div>
          <div class="hint">黑名单：勾选的群被禁止解析；白名单：仅勾选的群允许解析。</div>
        </div>
        <div class="seg" id="mode-seg">
          <button data-mode="blacklist">黑名单</button>
          <button data-mode="whitelist">白名单</button>
        </div>
      </div>
    </div>

    <div class="field">
      <div class="row">
        <div>
          <div class="label">私聊消息允许解析</div>
          <div class="hint">关闭后，私聊（非群聊）将无法触发视频解析。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="private-allowed" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="field">
      <div class="label" style="margin-bottom:8px;">群聊名单</div>
      <div class="toolbar">
        <button class="btn small" id="btn-select-all">全选</button>
        <button class="btn small" id="btn-select-none">全不选</button>
        <button class="btn small" id="btn-refresh-groups">刷新群列表</button>
      </div>
      <div class="group-list" id="group-list">
        <div class="empty" id="group-empty">加载中…</div>
      </div>
    </div>

    <div class="row" style="justify-content:flex-end;margin-top:20px;">
      <button class="btn" id="btn-reset">重置</button>
      <button class="btn primary" id="btn-save">保存设置</button>
    </div>
  </div>
</div>

<script type="module">
const bridge = window.AstrBotPluginPage;

const els = {
  statusText: document.getElementById("login-status-text"),
  statusHint: document.getElementById("login-status-hint"),
  statusBadge: document.getElementById("login-badge"),
  btnStatusRefresh: document.getElementById("btn-status-refresh"),
  enabled: document.getElementById("filter-enabled"),
  modeSeg: document.getElementById("mode-seg"),
  privateAllowed: document.getElementById("private-allowed"),
  groupList: document.getElementById("group-list"),
  groupEmpty: document.getElementById("group-empty"),
  banner: document.getElementById("banner"),
  bannerErr: document.getElementById("banner-err"),
  btnSelectAll: document.getElementById("btn-select-all"),
  btnSelectNone: document.getElementById("btn-select-none"),
  btnRefreshGroups: document.getElementById("btn-refresh-groups"),
  btnReset: document.getElementById("btn-reset"),
  btnSave: document.getElementById("btn-save"),
};

let state = {
  enabled: false,
  mode: "blacklist",
  private_allowed: true,
  group_ids: [],
};
let allGroups = [];
let dirty = false;

function showBanner(msg, isErr) {
  els.banner.classList.remove("show");
  els.bannerErr.classList.remove("show");
  if (!msg) return;
  const target = isErr ? els.bannerErr : els.banner;
  target.textContent = msg;
  target.classList.add("show");
}

function renderBadge(loggedIn) {
  if (loggedIn === null || loggedIn === undefined) {
    els.statusText.textContent = "查询中…";
    els.statusHint.textContent = "正在向解析后端查询登录态";
    els.statusBadge.className = "status-badge loading";
    els.statusBadge.innerHTML = '<span class="spinner"></span>查询中';
    return;
  }
  if (loggedIn) {
    els.statusText.textContent = "已登录";
    els.statusHint.textContent = "抖音解析可直接使用；如遇风控会自动改用浏览器兜底。";
    els.statusBadge.className = "status-badge ok";
    els.statusBadge.textContent = "● 已登录";
  } else {
    els.statusText.textContent = "未登录";
    els.statusHint.textContent = "请让机器人发送 /dy登陆 扫码登录后再解析抖音。";
    els.statusBadge.className = "status-badge bad";
    els.statusBadge.textContent = "● 未登录";
  }
}

async function loadStatus() {
  renderBadge(null);
  try {
    const data = await bridge.apiGet("douyin_status");
    renderBadge(!!data.logged_in);
  } catch (err) {
    renderBadge(false);
    els.statusHint.textContent = "查询失败：" + (err && err.message ? err.message : err);
  }
}

function renderGroups() {
  els.groupList.innerHTML = "";
  if (!allGroups.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "未获取到任何群聊（请确认机器人已加入 QQ 群，并已连接 aiocqhttp 适配器）";
    els.groupList.appendChild(empty);
    return;
  }
  const selected = new Set((state.group_ids || []).map(String));
  for (const g of allGroups) {
    const gid = String(g.group_id);
    const item = document.createElement("label");
    item.className = "group-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(gid);
    cb.addEventListener("change", () => {
      const set = new Set((state.group_ids || []).map(String));
      if (cb.checked) set.add(gid); else set.delete(gid);
      state.group_ids = [...set];
      dirty = true;
    });
    const name = document.createElement("span");
    name.className = "gname";
    name.textContent = g.group_name || gid;
    const id = document.createElement("span");
    id.className = "gid";
    id.textContent = gid;
    item.appendChild(cb);
    item.appendChild(name);
    item.appendChild(id);
    els.groupList.appendChild(item);
  }
}

async function loadGroups() {
  els.groupList.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const data = await bridge.apiGet("groups");
    allGroups = Array.isArray(data.groups) ? data.groups : [];
  } catch (err) {
    allGroups = [];
    showBanner("获取群列表失败：" + (err && err.message ? err.message : err), true);
  }
  renderGroups();
}

async function loadFilter() {
  try {
    const data = await bridge.apiGet("group_filter");
    state.enabled = !!data.enabled;
    state.mode = data.mode === "whitelist" ? "whitelist" : "blacklist";
    state.private_allowed = data.private_allowed !== false;
    state.group_ids = Array.isArray(data.group_ids) ? data.group_ids.map(String) : [];
  } catch (err) {
    showBanner("读取配置失败：" + (err && err.message ? err.message : err), true);
  }
  syncControls();
}

function syncControls() {
  els.enabled.checked = state.enabled;
  els.privateAllowed.checked = state.private_allowed;
  [...els.modeSeg.querySelectorAll("button")].forEach((b) => {
    b.classList.toggle("active", b.dataset.mode === state.mode);
  });
}

function bindEvents() {
  els.enabled.addEventListener("change", () => { dirty = true; });
  els.privateAllowed.addEventListener("change", () => { dirty = true; });
  els.modeSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    state.mode = btn.dataset.mode;
    syncControls();
    dirty = true;
  });
  els.btnSelectAll.addEventListener("click", () => {
    state.group_ids = allGroups.map((g) => String(g.group_id));
    dirty = true;
    renderGroups();
  });
  els.btnSelectNone.addEventListener("click", () => {
    state.group_ids = [];
    dirty = true;
    renderGroups();
  });
  els.btnRefreshGroups.addEventListener("click", loadGroups);
  els.btnStatusRefresh.addEventListener("click", loadStatus);
  els.btnReset.addEventListener("click", async () => {
    await loadFilter();
    await loadGroups();
    dirty = false;
    showBanner("已重置为保存的配置");
  });
  els.btnSave.addEventListener("click", save);
}

async function save() {
  const payload = {
    enabled: els.enabled.checked,
    mode: state.mode,
    private_allowed: els.privateAllowed.checked,
    group_ids: state.group_ids.map(String),
  };
  els.btnSave.disabled = true;
  els.btnSave.textContent = "保存中…";
  try {
    await bridge.apiPost("group_filter/save", payload);
    state.enabled = payload.enabled;
    state.mode = payload.mode;
    state.private_allowed = payload.private_allowed;
    state.group_ids = payload.group_ids;
    dirty = false;
    showBanner("已保存，新设置立即生效。");
  } catch (err) {
    showBanner("保存失败：" + (err && err.message ? err.message : err), true);
  } finally {
    els.btnSave.disabled = false;
    els.btnSave.textContent = "保存设置";
  }
}

(async function init() {
  try { await bridge.ready(); } catch (err) { /* bridge may already be ready */ }
  bindEvents();
  await Promise.all([loadFilter(), loadGroups(), loadStatus()]);
})();
</script>
</body>
</html>
