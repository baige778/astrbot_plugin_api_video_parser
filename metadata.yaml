name: astrbot_plugin_api_video_parser
display_name: ParseVideo 视频图集解析
short_desc: 解析抖音/快手/B站等 27 个平台的视频与图集分享链接，需自建 parse-video-py 后端服务
desc: |
  需自建 parse-video-py 后端服务配合使用（部署见 README，后端仓库 https://github.com/baige778/parse-video-py）。
  解析短视频/图集分享链接并发送直链内容，支持 27 个平台，每个平台可独立开关。
  自动获取视频/图集直链直接发送，视频已删除可自定义提示语。支持「/dy登陆」命令：抖音网页版扫码登录，登录后自动保存 Cookie，解决抖音解析风控问题。
author: baige778
version: 0.3.26
support_platforms:
  - aiocqhttp
  - wecom
  - telegram
  - weixin_oc
  - qq_official
  - qq_official_webhook
repo: https://github.com/baige778/astrbot_plugin_api_video_parser
tags:
  - 视频解析
  - 图集解析
  - 去水印
  - 抖音
